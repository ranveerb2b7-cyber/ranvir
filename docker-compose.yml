# Local development stack. Usage: cp .env.example .env && docker compose up --build
name: sellerscope

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # The API and workers connect as the restricted app role (RLS applies, no DDL).
  DATABASE_URL: postgresql+asyncpg://${APP_DB_ROLE:-sellerscope_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sellerscope}
  APP_DB_ROLE: ${APP_DB_ROLE:-sellerscope_app}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  ENABLE_MOCK_CONNECTOR: ${ENABLE_MOCK_CONNECTOR:-false}
  # Access tokens are issued by the local GoTrue container (hosted Supabase in production).
  AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:54321/auth/v1}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Local dev: uploads on a volume shared by api + worker. Staging/production must use S3.
  STORAGE_BACKEND: local
  STORAGE_LOCAL_DIR: /data/storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sellerscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sellerscope}
      APP_DB_ROLE: ${APP_DB_ROLE:-sellerscope_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-change-me-local-only}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-local-only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  # ---- Local Supabase Auth (GoTrue). Staging/production use a hosted Supabase project. ----
  auth:
    image: supabase/gotrue:v2.197.0
    environment:
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}@postgres:5432/auth
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      GOTRUE_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:54321/auth/v1}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_SITE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${WEB_BASE_URL:-http://localhost:3000}/**
      GOTRUE_CORS_ALLOWED_HEADERS: apikey,x-supabase-api-version
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@sellerscope.local
      GOTRUE_SMTP_SENDER_NAME: SellerScope
    depends_on:
      postgres: { condition: service_healthy }

  # Serves GoTrue at /auth/v1 like a hosted Supabase project, so supabase-js works unchanged.
  auth-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/docker/auth-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:54321:8000"]
    depends_on: [auth]

  # One-off: applies migrations as the schema owner, then exits.
  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-env
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sellerscope}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sellerscope}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./apps/api
    environment: *api-env
    volumes: [uploads:/data/storage]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      retries: 5

  worker:
    build: ./apps/api
    command: ["celery", "-A", "sellerscope.workers.celery_app", "worker", "-Q", "default,imports,scans.amazon,reports,alerts", "--loglevel=INFO"]
    environment: *api-env
    volumes: [uploads:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    build: ./apps/api
    command: ["celery", "-A", "sellerscope.workers.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *api-env
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* values are compiled into the browser bundle at build time.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-dev-anon-key}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-dev-anon-key}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api, auth-gateway]

volumes:
  uploads:
  pgdata:
  redisdata:
  miniodata:
