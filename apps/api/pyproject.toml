[project]
name = "sellerscope-api"
version = "0.1.0"
description = "SellerScope backend: FastAPI API + Celery workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.32,<0.33",
  "alembic>=1.20,<2",
  "celery[redis]>=5.7,<5.8",
  "redis>=8.1,<9",
  "structlog>=26.1",
  "pyjwt[crypto]>=2.10,<3",
  "email-validator>=2.2,<3",
  "openpyxl>=3.1.5,<4",
  "python-multipart>=0.0.33",
  "boto3>=1.44,<2",
  "prometheus-client>=0.23,<0.24",
  "sentry-sdk[celery,fastapi]>=2.40,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.4,<2",
  "httpx>=0.28,<0.29",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "aiosmtpd>=1.4,<2",
  "moto[s3]>=5.2,<6",
  "types-openpyxl>=3.1.5.20261017",
  "boto3-stubs[s3]>=1.44.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sellerscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs real PostgreSQL and Redis (DATABASE_URL, REDIS_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
# Tests and migrations build DDL from constants / validated identifiers.
"tests/**" = ["S105", "S106", "S608"]
"migrations/versions/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sellerscope.workers.*"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
