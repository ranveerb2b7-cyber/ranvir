# LOCAL DEVELOPMENT ONLY. Serves the GoTrue container under /auth/v1, the path supabase-js
# expects (on hosted Supabase this is done by the project's API gateway).
server {
  listen 8000;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 404;
  }
}
